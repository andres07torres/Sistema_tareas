services:
  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - CRON_TOKEN=${CRON_TOKEN}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - APP_URL=${APP_URL}
      - APACHE_DOCUMENT_ROOT=${APACHE_DOCUMENT_ROOT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.sistema-tareas-bot-zi53w4-4-web.rule=Host(`tareas.andr3sdev7.com`)
      - traefik.http.routers.sistema-tareas-bot-zi53w4-4-web.entrypoints=web
      - traefik.http.services.sistema-tareas-bot-zi53w4-4-web.loadbalancer.server.port=80
      - traefik.http.routers.sistema-tareas-bot-zi53w4-4-web.service=sistema-tareas-bot-zi53w4-4-web
      - traefik.enable=true
    networks:
      - dokploy-network
      - supabase-net

networks:
  dokploy-network:
    external: true
  supabase-net:
    external: true
    name: sistema-tareas-bot-supabase-ojj6pm_default
